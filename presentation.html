<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Project Udyam Digital — Airtel SYNC Hackathon 7-Slide Presentation</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .slide-active { border-color: #E40000 !important; box-shadow: 0 0 0 2px #E40000; }

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between select-none">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-950/80 backdrop-blur border-b border-slate-800 px-6 py-3.5 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-bold text-white shadow-md shadow-red-600/30">
        U
      </div>
      <div>
        <h1 class="text-sm font-bold text-white flex items-center gap-2">
          Project Udyam Digital
          <span class="text-xs px-2 py-0.5 rounded-full bg-red-950/80 border border-red-800/60 text-red-400 font-semibold">Airtel SYNC 2026</span>
        </h1>
        <p class="text-xs text-slate-400">Enterprise Track A — Making Small Businesses Go Digital in One Sitting</p>
      </div>
    </div>

    <!-- Slide Indicators & Controls -->
    <div class="flex items-center gap-4">
      <div class="text-xs text-slate-300 font-medium bg-slate-800/80 px-3 py-1.5 rounded-md border border-slate-700">
        Slide <span id="current-slide-num" class="font-bold text-red-400">1</span> of <span class="font-bold">7</span>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="prev-btn" onclick="prevSlide()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="next-btn" onclick="nextSlide()" class="p-2 rounded-lg bg-red-600 hover:bg-red-500 text-white font-medium shadow-md shadow-red-600/30 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <button onclick="toggleScriptModal()" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
        Presenter Script
      </button>

      <a href="Project_Udyam_Digital_Airtel_SYNC_7_Slides.pptx" download class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1.5 shadow-md shadow-emerald-600/30">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download PPTX
      </a>
    </div>
  </header>

  <!-- Main Slide Display Area -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 md:p-6 max-w-7xl mx-auto w-full">
    <div class="relative w-full aspect-[16/9] max-w-5xl bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 group">
      <img id="active-slide-img" src="slide_previews/slide_1.png" alt="Slide Preview" class="w-full h-full object-contain transition-all duration-300">
      
      <!-- Hover Overlay Arrows -->
      <button onclick="prevSlide()" class="absolute left-3 top-1/2 -translate-y-1/2 p-3 rounded-full bg-slate-900/70 hover:bg-red-600 text-white backdrop-blur opacity-0 group-hover:opacity-100 transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button onclick="nextSlide()" class="absolute right-3 top-1/2 -translate-y-1/2 p-3 rounded-full bg-slate-900/70 hover:bg-red-600 text-white backdrop-blur opacity-0 group-hover:opacity-100 transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
      </button>

      <!-- Slide Title Overlay Banner -->
      <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent p-4 flex items-center justify-between text-xs text-slate-300">
        <span id="slide-caption" class="font-semibold text-white">Slide 1: Project Title & Executive Summary</span>
        <span class="text-slate-400">Use Arrow Keys (← / →) to Navigate</span>
      </div>
    </div>

    <!-- Script Drawer Card -->
    <div id="script-container" class="mt-4 w-full max-w-5xl bg-slate-950 border border-slate-800 rounded-xl p-4 transition-all">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs uppercase tracking-wider font-bold text-red-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          30-Second Presenter Pitch Script
        </span>
        <span class="text-xs text-slate-500 font-mono">Speaker Note</span>
      </div>
      <p id="slide-script-text" class="text-sm text-slate-300 leading-relaxed font-sans"></p>
    </div>
  </main>

  <!-- Bottom Thumbnails Strip -->
  <footer class="bg-slate-950 border-t border-slate-800 p-3">
    <div class="max-w-6xl mx-auto flex items-center justify-center gap-3 overflow-x-auto py-1">
      <button onclick="goToSlide(1)" class="thumb-btn flex-shrink-0 w-28 aspect-[16/9] rounded-lg overflow-hidden border border-slate-700 transition hover:opacity-100 relative group" data-slide="1">
        <img src="slide_previews/slide_1.png" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1.5 py-0.5 rounded text-white font-bold">1</span>
      </button>
      <button onclick="goToSlide(2)" class="thumb-btn flex-shrink-0 w-28 aspect-[16/9] rounded-lg overflow-hidden border border-slate-700 transition hover:opacity-100 relative group" data-slide="2">
        <img src="slide_previews/slide_2.png" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1.5 py-0.5 rounded text-white font-bold">2</span>
      </button>
      <button onclick="goToSlide(3)" class="thumb-btn flex-shrink-0 w-28 aspect-[16/9] rounded-lg overflow-hidden border border-slate-700 transition hover:opacity-100 relative group" data-slide="3">
        <img src="slide_previews/slide_3.png" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1.5 py-0.5 rounded text-white font-bold">3</span>
      </button>
      <button onclick="goToSlide(4)" class="thumb-btn flex-shrink-0 w-28 aspect-[16/9] rounded-lg overflow-hidden border border-slate-700 transition hover:opacity-100 relative group" data-slide="4">
        <img src="slide_previews/slide_4.png" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1.5 py-0.5 rounded text-white font-bold">4</span>
      </button>
      <button onclick="goToSlide(5)" class="thumb-btn flex-shrink-0 w-28 aspect-[16/9] rounded-lg overflow-hidden border border-slate-700 transition hover:opacity-100 relative group" data-slide="5">
        <img src="slide_previews/slide_5.png" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1.5 py-0.5 rounded text-white font-bold">5</span>
      </button>
      <button onclick="goToSlide(6)" class="thumb-btn flex-shrink-0 w-28 aspect-[16/9] rounded-lg overflow-hidden border border-slate-700 transition hover:opacity-100 relative group" data-slide="6">
        <img src="slide_previews/slide_6.png" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1.5 py-0.5 rounded text-white font-bold">6</span>
      </button>
      <button onclick="goToSlide(7)" class="thumb-btn flex-shrink-0 w-28 aspect-[16/9] rounded-lg overflow-hidden border border-slate-700 transition hover:opacity-100 relative group" data-slide="7">
        <img src="slide_previews/slide_7.png" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-black/80 text-[10px] px-1.5 py-0.5 rounded text-white font-bold">7</span>
      </button>
    </div>
  </footer>

  <script>
    const slidesData = [
      {
        num: 1,
        title: "Slide 1: Project Title & Executive Premise",
        img: "slide_previews/slide_1.png",
        script: "\"Good morning, members of the jury. Today, over 6 crore Indian small businesses—from your local clinic to the neighbourhood kirana—run on fragmented digital tools. Accel Business has the right solutions, but the legacy acquisition engine is slow, paper-heavy, taking nearly 18 days to activate and losing 93% of interested leads. We built Project Udyam Digital: an autonomous, self-serve platform that lets any Indian business owner discover the right telecom bundle, complete KYC, and start activation in one sitting.\""
      },
      {
        num: 2,
        title: "Slide 2: The Core Problem & Funnel Breakdown",
        img: "slide_previews/slide_2.png",
        script: "\"Let's look at the real baseline data from the 5,000 leads dataset. The biggest funnel cliff occurs right after needs discovery: 56% of interested business owners abandon the process because they wait up to 5 days for a confusing PDF quote filled with internal telco codes. For micro-businesses without a GSTIN, activation plunges to an abysmal 2%. Acquiring one active customer currently costs ₹15,000 against a ₹6,900 monthly bundle. The legacy sales motion simply cannot scale profitably for MSMEs.\""
      },
      {
        num: 3,
        title: "Slide 3: Market Segmentation & Bundling Strategy",
        img: "slide_previews/slide_3.png",
        script: "\"India's MSMEs are not monolithic. 80% of the market consists of micro-retailers and professional offices. A kirana store owner does not need an MPLS circuit; they want rock-solid Wi-Fi so their UPI payment soundbox never fails, plus a WhatsApp channel for orders. A dental clinic needs high-speed fiber, Google Workspace, and patient privacy. We engineered Udyam Digital to instantly match these profiles with pre-configured, outcome-based product bundles.\""
      },
      {
        num: 4,
        title: "Slide 4: The Solution: 15-Minute 4-Step Customer Journey",
        img: "slide_previews/slide_4.png",
        script: "\"Udyam Digital collapses a multi-week ordeal into a seamless 15-minute journey. Business owners speak or chat with our GenAI advisor in plain Hindi or English, customize their bundle with clear transparent pricing, snap a photo of their registration certificate for sub-second verification, and authorize their order. No pushy sales reps, no mystery product codes, and zero paperwork.\""
      },
      {
        num: 5,
        title: "Slide 5: Smart KYC Breakthrough & DPDP Act 2023 Compliance",
        img: "slide_previews/slide_5.png",
        script: "\"KYC has always been the graveyard of SMB sales. When micro-enterprises lack a GST certificate, sales reps abandon them. Our Smart KYC engine supports both GSTIN and MSME Udyam certificates. We fine-tuned Tesseract OCR with single-block row segmentation to extract legal names and operational addresses with 100% precision even under synthetic watermarks. Furthermore, it is fully compliant with the DPDP Act 2023 through explicit digital consent and data minimization.\""
      },
      {
        num: 6,
        title: "Slide 6: Channel Partner & Field Force Synergy",
        img: "slide_previews/slide_6.png",
        script: "\"A critical concern in digital transformation is channel friction. Udyam Digital does not replace the sales force—it supercharges it. In assisted mode, field reps use our app to configure quotes and verify KYC on-site in 10 minutes. Local IT shops and telecom retailers get partner QR codes with recurring revenue-sharing. The field force moves from manual paper-pushers to strategic enterprise advisors.\""
      },
      {
        num: 7,
        title: "Slide 7: Business Impact, Unit Economics & Phased Roadmap",
        img: "slide_previews/slide_7.png",
        script: "\"The business impact is transformative. We quadruple conversion rates from 7.3% to nearly 30%, slash acquisition costs by 78% from ₹15,000 to under ₹3,200, and accelerate activation to under 48 hours. For every 10,000 leads, Accel Business unlocks ₹17 Crore in new annual recurring revenue while saving ₹12 Crore in operational acquisition costs. Project Udyam Digital is fully tested, working, and ready to deploy. Thank you!\""
      }
    ];

    let currentIndex = 0;

    function renderSlide(index) {
      const data = slidesData[index];
      document.getElementById('active-slide-img').src = data.img;
      document.getElementById('current-slide-num').innerText = data.num;
      document.getElementById('slide-caption').innerText = data.title;
      document.getElementById('slide-script-text').innerText = data.script;

      // Update thumbnails
      document.querySelectorAll('.thumb-btn').forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('slide-active');
        } else {
          btn.classList.remove('slide-active');
        }
      });
    }

    function nextSlide() {
      if (currentIndex < slidesData.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    function goToSlide(num) {
      currentIndex = num - 1;
      renderSlide(currentIndex);
    }

    function toggleScriptModal() {
      const el = document.getElementById('script-container');
      el.classList.toggle('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
